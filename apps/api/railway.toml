# Build from apps/api Dockerfile (Neon + R2 stay external)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["src/**", "package.json", "package-lock.json", "Dockerfile", "docker-entrypoint.sh"]

[deploy]
healthcheckPath = "/health/live"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
