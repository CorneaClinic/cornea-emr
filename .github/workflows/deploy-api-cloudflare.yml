# Deploy Express API on Cloudflare Containers (fresh stack — no DigitalOcean).
# Requires Docker on the runner (ubuntu-latest provides it) + repo secrets listed in docs/FRESH_CLOUDFLARE_STACK.md
name: Deploy API (Cloudflare)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/api-cf/**'
      - '.github/workflows/deploy-api-cloudflare.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api-cf/package-lock.json

      - name: Install api-cf dependencies
        working-directory: apps/api-cf
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_DATABASE_URL: ${{ secrets.CF_DATABASE_URL }}
          CF_JWT_SECRET: ${{ secrets.CF_JWT_SECRET }}
          CF_SECRETS_ENCRYPTION_KEY: ${{ secrets.CF_SECRETS_ENCRYPTION_KEY }}
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_DATABASE_URL CF_JWT_SECRET CF_SECRETS_ENCRYPTION_KEY; do
            eval "val=\$$v"
            if [ -z "$val" ]; then
              echo "::error::Missing secret $v — see docs/FRESH_CLOUDFLARE_STACK.md"
              missing=1
            fi
          done
          exit $missing

      - name: Deploy Worker + Container image
        working-directory: apps/api-cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Sync Worker secrets into production
        working-directory: apps/api-cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_DATABASE_URL: ${{ secrets.CF_DATABASE_URL }}
          CF_JWT_SECRET: ${{ secrets.CF_JWT_SECRET }}
          CF_SECRETS_ENCRYPTION_KEY: ${{ secrets.CF_SECRETS_ENCRYPTION_KEY }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_SEED_ADMIN_EMAIL: ${{ secrets.CF_SEED_ADMIN_EMAIL }}
          CF_SEED_ADMIN_PASSWORD: ${{ secrets.CF_SEED_ADMIN_PASSWORD }}
        run: |
          printf '%s' "$CF_DATABASE_URL" | npx wrangler secret put DATABASE_URL
          printf '%s' "$CF_JWT_SECRET" | npx wrangler secret put JWT_SECRET
          printf '%s' "$CF_SECRETS_ENCRYPTION_KEY" | npx wrangler secret put SECRETS_ENCRYPTION_KEY
          if [ -n "$CF_R2_ACCESS_KEY_ID" ]; then
            printf '%s' "$CF_R2_ACCESS_KEY_ID" | npx wrangler secret put MEDIA_S3_ACCESS_KEY_ID
          fi
          if [ -n "$CF_R2_SECRET_ACCESS_KEY" ]; then
            printf '%s' "$CF_R2_SECRET_ACCESS_KEY" | npx wrangler secret put MEDIA_S3_SECRET_ACCESS_KEY
          fi
          if [ -n "$CF_SEED_ADMIN_EMAIL" ]; then
            printf '%s' "$CF_SEED_ADMIN_EMAIL" | npx wrangler secret put SEED_ADMIN_EMAIL
          fi
          if [ -n "$CF_SEED_ADMIN_PASSWORD" ]; then
            printf '%s' "$CF_SEED_ADMIN_PASSWORD" | npx wrangler secret put SEED_ADMIN_PASSWORD
            printf 'true' | npx wrangler secret put ALLOW_PRODUCTION_SEED
          fi

      - name: Smoke health
        run: |
          url="https://cornea-emr-api.visionemr-somtec.workers.dev/health/live"
          echo "GET $url"
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$url" || echo "000")
            echo "attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Health check did not return 200 yet — container may still be cold-starting. Check Workers logs."
          exit 0
